<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision Control Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --bg-input: rgba(15, 23, 42, 0.8);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #3b82f6;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --accent-danger: #ef4444;
      --border-color: rgba(255, 255, 255, 0.1);
      --glass-blur: blur(12px);
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      font-family: 'Pretendard', sans-serif; 
      background: var(--bg-main); 
      color: var(--text-primary);
      line-height: 1.5;
    }

    .container { 
      padding: 24px; 
      display: grid; 
      grid-template-columns: 400px 1fr; /* 좌측 400px, 우측 나머지 */
      gap: 24px; 
      max-width: 1440px; 
      margin: 0 auto; 
    }

    .panel { 
      background: var(--bg-card); 
      backdrop-filter: var(--glass-blur);
      border-radius: var(--radius-lg); 
      padding: 24px; 
      box-shadow: var(--shadow); 
      border: 1px solid var(--border-color);
    }
    
    h3 { 
      margin: 0 0 20px 0; 
      font-size: 1.25rem; 
      font-weight: 700; 
      display: flex; 
      align-items: center; 
      gap: 10px;
    }
    
    .form-section { margin-bottom: 24px; }
    .section-label { 
      font-size: 0.75rem; 
      font-weight: 700; 
      color: var(--accent-primary); 
      text-transform: uppercase; 
      margin-bottom: 10px; 
      display: block;
    }

    .row { display: flex; gap: 12px; margin-bottom: 16px; }
    .row > * { flex: 1; }
    
    input, select, textarea {
      width: 100%; 
      border: 1px solid var(--border-color); 
      border-radius: var(--radius-sm);
      padding: 10px 14px; 
      font-size: 14px; 
      background: var(--bg-input);
      color: var(--text-primary);
      outline: none;
    }

    button { 
      border: none; 
      border-radius: var(--radius-sm); 
      padding: 10px 16px; 
      cursor: pointer; 
      font-weight: 600; 
      transition: all 0.2s;
    }
    
    .btn-save { background: var(--accent-primary); color: white; width: 100%; margin-top: 12px; }
    .btn-delete { background: rgba(239, 68, 68, 0.15); color: var(--accent-danger); border: 1px solid var(--accent-danger); }
    .btn-new { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); border: 1px solid var(--border-color); }
    .btn-validate { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); border: 1px solid var(--border-color); }
    .btn-success-outline { background: rgba(16, 185, 129, 0.15); color: var(--accent-success); border: 1px solid var(--accent-success); }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: white; }

    .usb-group { display: flex; background: var(--bg-input); padding: 4px; border-radius: var(--radius-sm); gap: 4px; }
    .usb-group button { flex: 1; background: transparent; color: var(--text-secondary); font-size: 12px; }
    .usb-group button.active { background: var(--accent-primary); color: white; }

    .list-container { 
      max-height: 300px; 
      overflow-y: auto; 
      border-radius: var(--radius-md); 
      margin-bottom: 24px; 
      background: rgba(0, 0, 0, 0.2);
    }
    .list-item { 
      padding: 14px 16px; 
      border-bottom: 1px solid var(--border-color); 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
    }
    .list-item.active { background: rgba(59, 130, 246, 0.15); border-left: 4px solid var(--accent-primary); }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-on { background: var(--accent-success); box-shadow: 0 0 8px var(--accent-success); }
    .dot-off { background: #475569; }
    .item-id { font-weight: 700; font-size: 14px; display: block; }
    .item-sub { font-size: 12px; color: var(--text-secondary); }

    .video-wrap { 
      background: #000; 
      border-radius: var(--radius-md); 
      overflow: hidden; 
      position: relative; 
      aspect-ratio: 16/9; 
    }
    .video-img { width: 100%; height: 100%; object-fit: contain; }
    .video-overlay { 
      position: absolute; top: 14px; left: 14px; 
      background: rgba(15, 23, 42, 0.85); 
      color: white; padding: 5px 12px; 
      border-radius: 20px; font-size: 12px; 
      backdrop-filter: blur(4px);
    }

    /* 모드 설정 영역 */
    .mode-settings-container {
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: var(--radius-md);
      border: 1px dashed var(--border-color);
      margin-top: 10px;
    }
    .mode-info { font-size: 0.85rem; margin-top: 8px; padding: 8px; border-radius: var(--radius-sm); }
    .mode-info.auto { color: var(--accent-success); background: rgba(16, 185, 129, 0.1); }
    .mode-info.locked { color: var(--accent-danger); background: rgba(239, 68, 68, 0.1); }
    .checkbox-group { display: flex; align-items: center; gap: 8px; cursor: pointer; }

    #roi_msg { font-size: 13px; margin-top: 8px; }
    .ok { color: var(--accent-success); }
    .err { color: var(--accent-danger); }

    @media (max-width: 1000px) { .container { grid-template-columns: 1fr; } }
  </style>
</head>

<body class="page">
  <div id="admin-header"></div>

  <div class="container">
    <!-- Left Column: Configuration (Setting) -->
    <div class="panel">
      <h3 id="control-title"><i class="fas fa-cog"></i> 카메라 설정</h3>
      
      <div class="form-section">
        <span class="section-label">기본 정보 및 하드웨어</span>
        <div class="row">
          <input id="camera_id" placeholder="Camera ID" />
          <input id="camera_name" placeholder="카메라 이름" />
        </div >
        <div class="form-group" style="margin-bottom: 16px;">
          <label style="font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 4px;">Hardware Profile</label>
          <!-- 수정된 부분: input -> select -->
          <select id="hardware_id">
            <option value="">-- 하드웨어 선택 --</option>
            <!-- JS에서 hardware_profiles 목록을 동적으로 채웁니다 -->
          </select>
        </div >
        <div class="row">
          <select id="node_scope">
            <option value="indoor">Indoor (실내)</option>
            <option value="outdoor">Outdoor (실외)</option>
          </select>
          <label class="checkbox-group" style="font-size:14px; margin:0;">
            <input type="checkbox" id="is_active" style="width:auto;" /> 활성 상태
          </label>
        </div >
      </div >

      <div class="form-section">
        <span class="section-label">Vision Control Mode</span>
        <div class="form-group" style="margin-bottom: 16px;">
          <select id="control_mode">
            <option value="AUTO">AUTO (자동 추종)</option>
            <option value="MANUAL">MANUAL (수동 제어)</option>
            <option value="LOCKED">LOCKED (동작 정지)</option>
          </select>
        </div >

        <div id="mode_settings_area" class="mode-settings-container">
          <!-- MANUAL 모드 UI -->
          <div id="manual_settings" style="display: none;">
            <div class="form-group" style="margin-bottom: 16px;">
              <label style="font-size: 12px;">Target Angle (°)</label>
              <input type="number" id="manual_angle" min="0" max="180" value="0" />
            </div >
            <div class="form-group checkbox-group" style="font-size: 13px;">
              <input type="checkbox" id="manual_buzzer" style="width:auto;" />
              <label for="manual_buzzer">Enable Manual Buzzer</label>
            </div >
          </div >
          <!-- LOCKED 모드 안내 -->
          <div id="locked_message" style="display: none;">
            <p class="mode-info locked"><i class="fas fa-exclamation-triangle"></i> 동작 정지 모드입니다.</p>
          </div >
          <!-- AUTO 모드 안내 -->
          <div id="auto_message" style="display: block;">
            <p class="mode-info auto"><i class="fas fa-robot"></i> AI 자동 제어 모드</p>
          </div >
        </div >
      </div >

      <div class="form-section">
        <span class="section-label">영상 및 ROI 설정</span>
        <div class="form-group" style="margin-bottom: 16px;">
          <input id="video_source" placeholder="Source (0, 1, URL...)" />
        </div >
        <div class="row">
          <input id="preview_url" placeholder="미리보기 URL" />
          <button id="btn_preview" class="btn-secondary" type="button">적용</button>
        </div >
        <div class="usb-group">
          <button id="btn_usb_0" class="btn-validate" type="button">USB 0</button>
          <button id="btn_usb_1" class="btn-validate" type="button">USB 1</button>
          <button id="btn_usb_2" class="btn-validate" type="button">USB 2</button>
        </div >
        <div class="form-group" style="margin-top:15px;">
          <textarea id="roi_json" placeholder="ROI JSON 데이터"></textarea>
          <div id="roi_msg">ready</div >
          <button id="btn_validate" class="btn-validate" style="width:100%; margin-top:8px;" type="button">ROI 검증</button>
        </div >
      </div >

      <div class="action-buttons" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <button id="btn_new" class="btn-new" type="button">새로 만들기</button>
        <button id="btn_validate" class="btn-validate" type="button">ROI 검증</button>
        <button id="btn_save" class="btn-save" style="grid-column: span 2;" type="button">설정 저장하기</button>
        <button id="btn_delete" class="btn-delete" style="grid-column: span 2;" type="button">이 프로필 삭제</button>
        <button id="btn_set_active" class="btn-success-outline" style="grid-column: span 2;" type="button">✨ 현재 프로필 즉시 활성화</button>
      </div >
    </div >

    <!-- Right Column: List & Monitor -->
    <div class="panel">
      <!-- 1. 프로필 목록 (Top) -->
      <h3 style="margin-bottom: 15px;"><i class="fas fa-list"></i> 프로필 목록 & 모니터링</h3>
      <div class="list-container" id="profile_list">
        <!-- JS 렌더링 -->
      </div >

      <!-- 2. 실시간 모니터링 (Bottom) -->
      <div class="form-section" style="margin-bottom: 0;">
        <span class="section-label">실시간 영상 스트림</span>
        <div class="form-group" style="margin-bottom: 16px;">
          <input id="preview_url" placeholder="미리보기 URL 직접 입력" />
        </div >
        <div class="video-wrap">
          <div class="video-overlay" id="preview_overlay">No Stream</div >
          <img id="preview_img" class="video-img" alt="stream preview" />
        </div >
      </div >
    </div >
  </div >

  <script type="module" src="/js/admin/admin_vision_control.js"></script>
</body>
</html>
