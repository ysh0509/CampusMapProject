<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 수정된 부분: device.width -> device-width -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardware Management | Smart Campus</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --bg-input: rgba(15, 23, 42, 0.8);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #3b82f6;
      --accent-success: #10b981;
      --accent-danger: #ef4444;
      --accent-warning: #f59e0b;
      --border-color: rgba(255, 255, 255, 0.1);
      --glass-blur: blur(12px);
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      font-family: 'Pretendard', sans-serif; 
      background: var(--bg-main); 
      color: var(--text-primary);
      line-height: 1.5;
    }

    .container { 
      padding: 32px; 
      max-width: 1600px; 
      margin: 0 auto; 
    }

    h2 { 
      font-size: 1.75rem; 
      font-weight: 700; 
      margin-bottom: 24px; 
      display: flex; 
      align-items: center; 
      gap: 10px;
    }

    /* Grid Layout */
    .mgmt-grid {
      display: grid;
      grid-template-columns: 450px 1fr;
      gap: 24px;
    }

    .panel {
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    /* Form Styles */
    .form-section { margin-bottom: 24px; }
    .section-label { 
      font-size: 0.85rem; 
      color: var(--accent-primary); 
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: block;
    }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    
    input, select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent-primary); }

    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-full { grid-column: span 2; }

    button {
      padding: 12px;
      border-radius: var(--radius-sm);
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }
    .btn-primary { background: var(--accent-primary); color: white; }
    .btn-secondary { background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border-color); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--accent-danger); border: 1px solid var(--accent-danger); }
    button:hover { opacity: 0.8; transform: translateY(-2px); }

    /* List Styles */
    .list-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .list-container {
      height: 400px;
      overflow-y: auto;
      border-radius: var(--radius-md);
      background: rgba(0, 0, 0, 0.2);
    }
    .item {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background 0.2s;
    }
    .item:hover { background: rgba(255, 255, 255, 0.05); }
    .item.active { background: rgba(59, 130, 246, 0.15); border-left: 4px solid var(--accent-primary); }
    .item-main { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .item-id { font-weight: 700; color: var(--accent-primary); }
    .item-sub { font-size: 12px; color: var(--text-secondary); }

    /* Status Badge */
    .badge { padding: 4px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge-on { background: rgba(16, 185, 129, 0.2); color: var(--accent-success); }
    .badge-off { background: rgba(239, 68, 68, 0.2); color: var(--accent-danger); }

    @media (max-width: 1100px) {
      .mgmt-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="admin-header"></div>

  <div class="container">
    <h2><i class="fas fa-microchip"></i> 하드웨어 프로필 관리</h2>

    <div class="mgmt-grid">
      <!-- Left: Form Panel -->
      <div class="panel">
        <h3 style="margin-top:0; font-size: 1.1rem;"><i class="fas fa-edit"></i> 프로필 설정</h3>
        
        <div class="form-section">
          <span class="section-label">기본 식별 정보</span>
          <div class="form-group">
            <label>Hardware ID (Unique)</label>
            <input type="text" id="hw_id" placeholder="예: HW_ESP32_001">
          </div>
          <div class="form-group">
            <label>IP Address</label>
            <input type="text" id="hw_ip" placeholder="192.168.0.100">
          </div>
        </div>

        <div class="form-section">
          <span class="section-label">내비게이션 연결</span>
          <div class="form-group">
            <label>대상 포인트 (Target Point ID)</label>
            <input type="number" id="hw_target_point" placeholder="Navigation Element ID">
          </div>
          <div class="form-group">
            <label>활성 상태</label>
            <select id="hw_is_active">
              <option value="true">활성화 (Active)</option>
              <option value="false">비활성화 (Inactive)</option>
            </select>
          </div>
        </div>

        <div class="btn-group">
          <button id="btn_new" class="btn-secondary" type="button">신규 생성</button>
          <button id="btn_save" class="btn-primary" type="button">저장하기</button>
          <button id="btn_delete" class="btn-danger btn-full" type="button">프로필 삭제</button>
        </div>
      </div>

      <!-- Right: List Panel -->
      <div class="panel">
        <div class="list-header">
          <span>등록된 하드웨어 목록</span>
          <span id="hw_count" style="color: var(--accent-primary);">0</span>
        </div>
        <div class="list-container" id="hw_list">
          <!-- JS Rendering -->
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/admin/admin_hardware_mgmt.js"></script>
</body>
</html>
