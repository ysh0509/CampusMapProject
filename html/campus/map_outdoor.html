<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>캠퍼스 길찾기 | Campus Navigator</title>
  <script>
    window.__ENV = {
      SUPABASE_URL: 'https://zetmjnilmdfurkjafwte.supabase.co',
      SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpldG1qbmlsbWRmdXJramFmd3RlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3OTQ1NDAsImV4cCI6MjA5MTM3MDU0MH0.7BRTPKLPIefRfH32EOceQ_l9rOFE-j2LX2-v13QKEj8'
    };
  </script>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/campus/map_outdoor.css">
</head>
<body>
  <div id="landing-overlay">
    <div class="index-glow index-glow-primary"></div>
    <div class="index-glow index-glow-accent"></div>
    <a class="landing-home" href="/">Smart Campus</a>
    <div class="landing-content">
      <span class="landing-badge">AI CAMPUS NAVIGATION</span>
      <h1>Smart Campus</h1>
      <p>단순한 지도를 넘어, 공간의 상태를 읽고<br>최적의 흐름을 설계하는 AI 공간 지능 플랫폼</p>
      <div class="landing-btns">
        <button class="btn-main btn-primary" type="button" onclick="startApp()">서비스 시작하기</button>
        <button class="btn-main btn-secondary" type="button" onclick="location.href='/html/campus/map_indoor.html'">실내 지도 보기</button>
      </div>
    </div>
  </div>

  <header class="mobile-header">
    <a class="mobile-brand" href="/"><span>C</span> Campus Navigator</a>
    <button id="mobilePanelToggle" type="button" aria-expanded="true" aria-controls="panel">검색 접기</button>
  </header>

  <aside id="panel" aria-labelledby="search-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="panel-heading">
      <div><p class="eyebrow">Campus route</p><h1 id="search-title">어디로 갈까요?</h1></div>
      <a class="indoor-shortcut" href="/html/campus/map_indoor.html">실내 지도</a>
    </div>

    <div class="place-section">
      <div class="place-heading"><span class="place-number start">1</span><div><strong>출발지</strong><small>지도에서 위치를 선택할 수 있어요</small></div></div>
      <div class="toggle-group" id="startToggle">
        <button class="toggle" data-type="outdoor" type="button">야외</button>
        <button class="toggle" data-type="indoor" type="button">실내</button>
      </div>
      <div class="accordion" id="startIndoorBox">
        <div class="row">
          <div class="half"><label for="startBuilding">건물</label><select id="startBuilding"><option value="">건물 선택</option></select></div>
          <div class="half"><label for="startIndoorNode">실내 위치</label><select id="startIndoorNode"><option value="">위치 선택</option></select></div>
        </div>
        <label class="room-label" for="startRoomInput">강의실 번호 검색</label>
        <input id="startRoomInput" placeholder="예: 401">
      </div>
    </div>
    <div class="place-connector" aria-hidden="true"></div>
    <div class="place-section">
      <div class="place-heading"><span class="place-number end">2</span><div><strong>도착지</strong><small>목적지를 선택해 주세요</small></div></div>
      <div class="toggle-group" id="endToggle">
        <button class="toggle" data-type="outdoor" type="button">야외</button>
        <button class="toggle" data-type="indoor" type="button">실내</button>
      </div>
      <div class="accordion" id="endIndoorBox">
        <div class="row">
          <div class="half"><label for="endBuilding">건물</label><select id="endBuilding"><option value="">건물 선택</option></select></div>
          <div class="half"><label for="endIndoorNode">실내 위치</label><select id="endIndoorNode"><option value="">위치 선택</option></select></div>
        </div>
        <label class="room-label" for="endRoomInput">강의실 번호 검색</label>
        <input id="endRoomInput" placeholder="예: 401">
      </div>
    </div>
    <div class="panel-actions">
      <button id="runRoute" class="primary-action" type="button">경로 찾기 <span>→</span></button>
      <div class="secondary-actions"><button id="viewIndoor" class="ghost" type="button" disabled>실내 구간 보기</button><button id="reset" class="secondary" type="button">초기화</button></div>
    </div>
    <div id="status" role="status">출발지와 도착지 유형을 선택하세요.</div>
  </aside>

  <aside id="steps" class="steps-collapsed" aria-labelledby="steps-title">
    <button id="stepsHeader" type="button" aria-expanded="false">
      <span><small>Route guide</small><strong id="steps-title">경로 상세</strong></span><span class="steps-chevron">⌃</span>
    </button>
    <div id="stepsBody"><div class="guide-empty">경로를 검색하면 추천 경로가 표시됩니다.</div></div>
  </aside>

  <div id="map" aria-label="캠퍼스 지도"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="../../js/campus/map_outdoor.js"></script>
  <script>function startApp() { document.getElementById('landing-overlay').classList.add('hidden'); }</script>
</body>
</html>
