<head>
  <meta charset="UTF-8">

  <title>실내 길찾기 | Campus Navigator</title>

  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/campus/map_indoor.css">
</head>
<body>
  <section id="hero-section" aria-labelledby="hero-title">
    <div class="index-glow index-glow-primary"></div>
    <div class="index-glow index-glow-accent"></div>
    <nav class="hero-nav" aria-label="페이지 이동">
      <a class="brand" href="/"><span>Smart Campus</span></a>
      <a class="hero-map-link" href="/html/campus/map_outdoor.html">야외 지도</a>
    </nav>
    <div class="hero-content">
      <p class="eyebrow">Indoor Navigation</p>
      <h1 id="hero-title">Smart Campus</h1>
      <p class="hero-subtitle">복잡한 건물 안에서도 한눈에, 정확하게.<br>강의실부터 편의시설까지 가장 알맞은 실내 경로를 안내합니다.</p>
      <div class="button-group">
        <button class="hero-button primary" id="btn-start" type="button">실내 지도 시작</button>
        <button class="hero-button secondary" id="btn-map" type="button">야외 지도 보기</button>
      </div>
    </div>
  </section>

  <main id="main-content" aria-label="실내 지도">
    <div class="map-shell">
      <header class="map-header">
        <a class="brand compact" href="/"><span class="brand-mark">C</span><span>Campus Navigator</span></a>
        <div class="map-header-center"><span class="live-dot"></span><span id="statusText">실내 지도 준비 완료</span></div>
        <a class="outdoor-link" href="/html/campus/map_outdoor.html">야외 지도로 이동</a>
      </header>
      <div class="map-workspace">
        <div class="map-canvas">
          <div id="map"></div>
          <div id="floorOverlay" class="hidden" aria-live="polite"></div>
          <section id="guidePanel" class="location-card" aria-labelledby="location-title">
            <div class="location-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 21V7l8-4 8 4v14M8 10h2m4 0h2M8 14h2m4 0h2M9 21v-3h6v3"/></svg>
            </div>
            <div class="location-copy">
              <p class="section-kicker">시작 위치 설정</p>
              <h1 id="location-title">어디를 둘러볼까요?</h1>
              <p>건물과 층을 선택해 실내 지도를 열어보세요.</p>
            </div>
            <div class="field-stack">
              <label for="buildingSel">건물</label><label for="floorSel">층</label>
              <select id="buildingSel" aria-label="건물 선택"></select>
              <select id="floorSel" aria-label="층 선택"></select>
            </div>
            <button id="enterMap" class="action-button" type="button">이 층 지도 열기 <span>→</span></button>
          </section>
        </div>

        <aside class="route-panel hidden" id="routePanel" aria-labelledby="route-title">
          <button id="mobileSheetHandle" class="mobile-sheet-handle" type="button" aria-label="경로 패널 펼치기" aria-expanded="false">
            <span class="mobile-drag-handle" aria-hidden="true"></span>
            <span class="mobile-sheet-summary">경로 설정</span>
          </button>
          <div class="route-heading">
            <div><p class="section-kicker">Indoor route</p><h2 id="route-title">실내 경로 찾기</h2></div>
            <button id="closeRoutePanel" class="icon-button" type="button" aria-label="경로 패널 닫기">×</button>
          </div>
          <div class="context-selects">
            <div><label for="buildingMini">건물</label><select id="buildingMini"></select></div>
            <div><label for="floorMini">현재 층</label><select id="floorMini"></select></div>
          </div>
          <fieldset class="mode-fieldset">
            <legend>경로 옵션</legend>
            <div class="mode-tabs">
              <button class="modeBtn active" data-mode="optimal" type="button">추천</button>
              <button class="modeBtn" data-mode="shortest" type="button">최단</button>
              <button class="modeBtn" data-mode="avoid_stairs" type="button">계단 회피</button>
            </div>
          </fieldset>
          <div class="route-fields">
            <div class="route-point start">
              <span class="point-marker"></span>
              <div><label for="startFloor">출발지</label><div class="route-select-row"><select id="startFloor" aria-label="출발 층"></select><select id="startNode" aria-label="출발 위치"></select></div></div>
            </div>
            <div class="route-line" aria-hidden="true"></div>
            <div class="route-point end">
              <span class="point-marker"></span>
              <div><label for="endFloor">도착지</label><div class="route-select-row"><select id="endFloor" aria-label="도착 층"></select><select id="endNode" aria-label="도착 위치"></select></div></div>
            </div>
          </div>
          <div class="route-actions">
            <button id="runRoute" class="action-button" type="button">경로 찾기 <span>→</span></button>
            <button id="nextFloorBtn" class="next-floor-button hidden" type="button">다음 층으로 이동</button>
          </div>
          <p class="panel-hint">지도 위의 검은 점은 이동 가능한 주요 위치입니다.</p>
        </aside>
      </div>
    </div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/js/campus/map_indoor.js"></script>
</body>
</html>
